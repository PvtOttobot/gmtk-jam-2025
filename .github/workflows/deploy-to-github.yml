# Copied from: https://github.com/abarichello/godot-ci/blob/master/.github/workflows/godot-ci.yml.
# See that project for other export platforms.
name: "godot-ci github"

on:
  workflow_dispatch:
  push:
    branches:
      - integration

env:
  GODOT_VERSION: 4.3
  # EXPORT_NAME: gmtk-jam-2025
  PROJECT_PATH: project/gmtk-jam-2025

jobs:
  export-web:
    permissions:
      contents: write
    name: Web Export
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Overwrite Global Git Info
        run: |
          git config --global --add safe.directory /__w/gmtk-jam-2025/gmtk-jam-2025
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          AUTHOR=$(git log -1 --pretty=format:"%an")
          MESSAGE=$(git log -1 --pretty=format:"%s")
          DATE=$(date +"%Y-%m-%d %H:%M:%S %Z")
          
          # Create a Godot-compatible script file directly
          echo "# This file is automatically generated by GitHub Actions. Do not edit manually." > ${PROJECT_PATH}/scripts/global_git_info.gd
          echo "extends Node" >> global_git_info.gd
          echo "class_name BuildInfo" >> global_git_info.gd
          echo "" >> global_git_info.gd # Add a newline for readability
          echo "const BRANCH: String = \"${BRANCH}\"" >> global_git_info.gd
          echo "const AUTHOR: String = \"${AUTHOR}\"" >> global_git_info.gd
          echo "const AUTHOR: String = \"${MESSAGE}\"" >> global_git_info.gd
          echo "const AUTHOR: String = \"${DATE}\"" >> global_git_info.gd
      - name: Web Build
        run: |
          mkdir -v -p build/web
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Web" "$EXPORT_DIR/web/index.html"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
      - name: Install rsync 📚
        run: |
          apt-get update && apt-get install -y rsync
      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          branch: gh-pages # The branch the action should deploy to.
          folder: build/web # The folder the action should deploy.